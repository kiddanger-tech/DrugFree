<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lesson | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/academy.css">


</head>


<body>



<header class="page-header">


<h1>

📖 Lesson

</h1>


<a href="academy.html">

⬅ Academy

</a>


</header>







<section class="lesson-view">


<h2 id="lessonTitle">

Loading lesson...

</h2>



<p id="lessonDescription">

</p>




<div class="lesson-content">


<h3>

What You Will Learn

</h3>



<p>

This lesson helps you build knowledge, confidence, and healthy decision-making skills.

</p>



<ul>


<li>

Understand important concepts

</li>


<li>

Develop positive habits

</li>


<li>

Strengthen your decision-making skills

</li>


<li>

Earn XP and rewards

</li>


</ul>



</div>







<button id="completeLessonBtn">


Complete Lesson ⭐


</button>




</section>







<section class="orion-card">


<div id="orionMessage">


</div>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/xp-system.js"></script>

<script src="js/game/badges.js"></script>


<script src="js/learning/lessons.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>







<script>


let currentLesson = "lesson1";




function loadLesson(){


const lesson =

Lessons.getLesson(

currentLesson

);



if(!lesson)
return;



document.getElementById(

"lessonTitle"

)

.innerHTML =

lesson.title;




document.getElementById(

"lessonDescription"

)

.innerHTML =

lesson.description;




}




document.getElementById(

"completeLessonBtn"

)

.addEventListener(

"click",

async ()=>{


await Lessons.completeLesson(

currentLesson

);



if(window.Orion){


Orion.lessonComplete();


}



}

);






document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(()=>{


loadLesson();



},1000);


});



</script>




</body>

</html>
