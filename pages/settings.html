<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/setting.css">


</head>


<body>


<header class="page-header">


<h1>

⚙️ Settings

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="settings-intro">


<h2>

Customize Your Experience

</h2>


<p>

Manage your account and personalize DrugFree Quest.

</p>


</section>







<section class="orion-card">


<div id="orionMessage">

</div>


</section>







<section class="settings-container">



<div class="setting-card">


<h3>

👤 Account

</h3>


<p id="accountInfo">

Loading account...

</p>


</div>







<div class="setting-card">


<h3>

🎨 Appearance

</h3>



<label>

<input type="checkbox" id="darkModeToggle">

Dark Mode

</label>


</div>







<div class="setting-card">


<h3>

🔔 Notifications

</h3>



<label>

<input type="checkbox" id="notificationToggle" checked>

Mission reminders

</label>


</div>







<div class="setting-card">


<h3>

🔒 Privacy

</h3>


<button id="logoutButton">

Logout

</button>


</div>




</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/auth/logout.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>







<script>


async function loadSettings(){


const profile =

await DB.getUserProfile();



if(profile){


document.getElementById(

"accountInfo"

)

.innerHTML =


`

<b>${profile.username}</b>

<br>

Level ${profile.level || 1}

<br>

${profile.xp || 0} XP

`;



}



if(window.Orion){


Orion.say(

"Your settings are ready. Customize your journey!"

);


}


}







document.getElementById(

"darkModeToggle"

)

.addEventListener(

"change",

(e)=>{


document.body.classList.toggle(

"dark-mode",

e.target.checked

);


});







document.getElementById(

"logoutButton"

)

.addEventListener(

"click",

()=>{


if(window.logoutUser){

logoutUser();

}


});








document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadSettings,

1000

);


});



</script>





</body>

</html>
