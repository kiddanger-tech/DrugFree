<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/community.css">


</head>


<body>


<header class="page-header">


<h1>

🤝 Orion Community

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="community-intro">


<h2>

Connect With Champions

</h2>


<p>

Share your progress, support others, and grow together.

</p>


</section>







<section class="orion-card">


<div id="orionMessage">


</div>


</section>







<section class="community-profile">


<h2>

Community Status

</h2>



<div id="communityUser">


Loading profile...

</div>


</section>







<section class="community-board">


<h2>

Community Feed

</h2>



<div id="postContainer">


<div class="post-card">


<h3>

🌱 Welcome to DrugFree Quest

</h3>


<p>

Start your journey and encourage other members.

</p>


</div>


</div>


</section>







<section class="community-chat">


<h2>

💬 Chat Room

</h2>



<div class="chat-box">


<p>

Community chat will connect here.

</p>


</div>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>








<script>


async function loadCommunity(){



const profile =

await DB.getUserProfile();




if(profile){


document.getElementById(

"communityUser"

)

.innerHTML =


`

<h3>

${profile.username}

</h3>


<p>

Level ${profile.level || 1}

 • 

${profile.xp || 0} XP

</p>

`;



}




if(window.Orion){


Orion.say(

"Welcome to the community! Support others and grow together."

);


}



}





document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadCommunity,

1000

);


});



</script>





</body>

</html>
