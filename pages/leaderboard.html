<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/leaderboard.css">


</head>


<body>


<header class="page-header">


<h1>

🏆 Orion Leaderboard

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="leaderboard-intro">


<h2>

Top Drug-Free Champions

</h2>


<p>

Compete with other learners and climb the rankings.

</p>


</section>







<section class="orion-card">


<div id="orionMessage">


</div>


</section>







<section class="ranking-controls">


<button onclick="loadRanking('xp')">

⭐ XP Ranking

</button>



<button onclick="loadRanking('level')">

🏅 Level Ranking

</button>



<button onclick="loadRanking('streak')">

🔥 Streak Ranking

</button>


</section>







<section class="leaderboard-area">


<div id="leaderboardContainer">


<!-- Players load here -->


</div>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/leaderboard.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>








<script>


function loadRanking(type){


Leaderboard.display(

"leaderboardContainer",

type

);



if(window.Orion){


Orion.say(

"Great choice! Keep learning and climb the leaderboard."

);


}



}





document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(()=>{


loadRanking("xp");



},1000);



});



</script>





</body>

</html>
