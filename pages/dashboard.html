<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DrugFree Quest Dashboard</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/dashboard.css">


</head>


<body>


<header class="dashboard-header">


<h1>
🤖 DrugFree Quest
</h1>


<button class="logout-btn">

Logout

</button>


</header>




<section class="orion-card">


<div class="orion-image">

<img 
src="images/orion.png"
alt="Orion Mascot"
>


</div>



<div id="orionMessage">


</div>


</section>







<section class="profile-card">


<h2>

Welcome,

<span id="username">

Player

</span>

</h2>



<div class="stats">


<div class="stat-box">

<h3>⭐ XP</h3>

<p id="xp">

0

</p>

</div>



<div class="stat-box">

<h3>🏆 Level</h3>

<p id="level">

1

</p>

</div>



<div class="stat-box">

<h3>🔥 Streak</h3>

<p id="streak">

0

</p>

</div>



<div class="stat-box">

<h3>🏅 Badges</h3>

<p id="badges">

0

</p>

</div>


</div>


</section>








<section class="dashboard-menu">


<a href="academy.html">

📚 Academy

</a>



<a href="missions.html">

🎯 Missions

</a>



<a href="quizzes.html">

🧠 Quizzes

</a>



<a href="leaderboard.html">

🏆 Leaderboard

</a>



<a href="community.html">

🤝 Community

</a>



<a href="profile.html">

👤 Profile

</a>


</section>







<section class="progress-card">


<h2>

Your Journey

</h2>


<div class="progress-bar">


<div 
id="progressFill"
class="progress-fill">

</div>


</div>


<p id="progressText">

0% Complete

</p>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/xp-system.js"></script>

<script src="js/game/badges.js"></script>

<script src="js/game/streaks.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/auth/logout.js"></script>


<script src="js/app.js"></script>





<script>


async function loadDashboard(){



if(window.App.mode === "guest"){

document.getElementById("username").innerHTML =
"Guest";

return;

}



const profile =
await DB.getUserProfile();



if(!profile)
return;



document.getElementById("username").innerHTML =
profile.username;



document.getElementById("xp").innerHTML =
profile.xp || 0;



document.getElementById("level").innerHTML =
profile.level || 1;



document.getElementById("streak").innerHTML =
profile.streak || 0;



document.getElementById("badges").innerHTML =
(profile.badges || []).length;



let progress =
0;



if(profile.completedLessons){

progress += profile.completedLessons.length * 10;

}


if(profile.completedQuizzes){

progress += profile.completedQuizzes.length * 10;

}


if(progress > 100)
progress = 100;



document.getElementById(
"progressFill"
)
.style.width =
progress + "%";



document.getElementById(
"progressText"
)
.innerHTML =
progress + "% Complete";



}



document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadDashboard,

1000

);


});


</script>



</body>

</html>
