<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quizzes | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/quiz.css">


</head>


<body>


<header class="page-header">


<h1>
🧠 Orion Quiz Zone
</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>






<section class="quiz-intro">


<h2>

Test Your Knowledge

</h2>


<p>

Complete quizzes, earn XP, and prove your skills.

</p>


</section>







<section class="quiz-box">


<div id="quizContainer">


<!-- Questions load here -->


</div>



<button id="submitQuiz">


Submit Quiz ⭐

</button>


</section>







<section class="result-box">


<div id="quizResult">


</div>


</section>







<section class="orion-card">


<div id="orionMessage">


</div>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/xp-system.js"></script>

<script src="js/game/badges.js"></script>


<script src="js/learning/quizzes.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>






<script>


const quizID = "beginner";



document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(()=>{


Quizzes.display(

quizID,

"quizContainer"

);



if(window.Orion){

Orion.say(

"Welcome to the quiz zone! Choose your answers carefully."

);

}


},1000);



});







document.getElementById(

"submitQuiz"

)

.addEventListener(

"click",

async ()=>{


const answers =

Quizzes.collectAnswers();




const result =

await Quizzes.submitQuiz(

quizID,

answers

);




document.getElementById(

"quizResult"

)

.innerHTML =


`

<h2>

🎉 Quiz Complete!

</h2>


<p>

Score:

${result.score}/${result.total}

</p>


<p>

${result.percentage}% Correct

</p>

`;




if(window.Orion){

Orion.quizComplete();

}



}


);



</script>





</body>

</html>
