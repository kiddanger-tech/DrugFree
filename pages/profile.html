<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/profile.css">


</head>


<body>


<header class="page-header">


<h1>

👤 My Profile

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="profile-container">



<div class="avatar-box">


<img id="userAvatar"

src="images/default-avatar.png"

alt="Avatar">


</div>





<h2 id="username">

Loading...

</h2>



<p id="email">

</p>



</section>







<section class="profile-stats">


<div class="profile-card">


<h3>

⭐ XP

</h3>


<p id="xp">

0

</p>


</div>





<div class="profile-card">


<h3>

🏆 Level

</h3>


<p id="level">

1

</p>


</div>





<div class="profile-card">


<h3>

🔥 Streak

</h3>


<p id="streak">

0

</p>


</div>





<div class="profile-card">


<h3>

🪙 Coins

</h3>


<p id="coins">

0

</p>


</div>


</section>







<section class="achievement-section">


<h2>

🏅 Achievements

</h2>


<div id="badgeContainer">


</div>


</section>







<section class="certificate-section">


<h2>

📜 Certificates

</h2>


<div id="certificateContainer">


</div>


</section>







<section class="orion-card">


<div id="orionMessage">

</div>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/badges.js"></script>

<script src="js/game/rewards.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>







<script>


async function loadProfile(){



const profile =

await DB.getUserProfile();



if(!profile){

return;

}





document.getElementById(

"username"

)

.innerHTML =

profile.username || "Player";





document.getElementById(

"email"

)

.innerHTML =

profile.email || "";





document.getElementById(

"xp"

)

.innerHTML =

profile.xp || 0;





document.getElementById(

"level"

)

.innerHTML =

profile.level || 1;





document.getElementById(

"streak"

)

.innerHTML =

profile.streak || 0;





document.getElementById(

"coins"

)

.innerHTML =

profile.coins || 0;






const badges =

profile.badges || [];



document.getElementById(

"badgeContainer"

)

.innerHTML =

badges.length

?

badges.map(

badge =>

`<span class="badge">

🏅 ${badge}

</span>`

).join("")

:

"No badges yet";






const certificates =

profile.certificates || [];



document.getElementById(

"certificateContainer"

)

.innerHTML =

certificates.length

?

certificates.map(

certificate =>

`<div class="certificate">

📜 ${certificate.name}

</div>`

).join("")

:

"No certificates yet";







if(window.Orion){


Orion.say(

"Welcome back! Keep building your amazing journey."

);


}



}




document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadProfile,

1000

);


});



</script>





</body>

</html>
