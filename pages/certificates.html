<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/certificate.css">


</head>


<body>


<header class="page-header">


<h1>

📜 Certificates

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="certificate-intro">


<h2>

Your Achievements

</h2>


<p>

Certificates show your completed learning milestones.

</p>


</section>







<section class="orion-card">


<div id="orionMessage">


</div>


</section>







<section class="certificate-area">


<h2>

My Certificates

</h2>



<div id="certificateContainer">


<!-- Certificates load here -->


</div>



</section>







<section class="certificate-actions">


<button id="printCertificate">


🖨 Print Certificate

</button>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/rewards.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>








<script>


async function loadCertificates(){



const profile =

await DB.getUserProfile();




const certificates =

profile?.certificates || [];






const container =

document.getElementById(

"certificateContainer"

);





if(certificates.length === 0){


container.innerHTML =

`

<div class="empty-certificate">

No certificates earned yet.

Complete lessons and missions to unlock them.

</div>

`;

return;


}






container.innerHTML =

certificates.map(

certificate =>



`

<div class="certificate-card">


<h3>

📜 ${certificate.name}

</h3>


<p>

Completed:

${certificate.date || "Recently"}

</p>


</div>


`



).join("");







if(window.Orion){


Orion.say(

"Congratulations! Your hard work has earned recognition."

);


}



}








document.getElementById(

"printCertificate"

)

.addEventListener(

"click",

()=>{


window.print();


});







document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadCertificates,

1000

);


});



</script>





</body>

</html>
