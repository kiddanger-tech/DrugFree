<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievements | DrugFree Quest</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/achievement.css">


</head>


<body>


<header class="page-header">


<h1>

🏅 Achievements

</h1>


<a href="dashboard.html">

⬅ Dashboard

</a>


</header>







<section class="achievement-intro">


<h2>

Your Progress Journey

</h2>


<p>

Unlock badges by completing lessons, missions, and quizzes.

</p>


</section>







<section class="orion-card">


<div id="orionMessage">

</div>


</section>







<section class="achievement-area">


<h2>

Badges Collection

</h2>


<div id="achievementContainer">


<!-- Badges load here -->


</div>


</section>







<section class="progress-achievements">


<h2>

Achievement Progress

</h2>


<div class="progress-bar">


<div id="achievementProgress">

</div>


</div>


<p id="progressText">

0% Complete

</p>


</section>








<script src="js/database/firebase-config.js"></script>

<script src="js/database/database.js"></script>

<script src="js/database/users.js"></script>


<script src="js/game/badges.js"></script>

<script src="js/game/xp-system.js"></script>


<script src="js/mascot/orion.js"></script>


<script src="js/app.js"></script>








<script>


async function loadAchievements(){



const profile =

await DB.getUserProfile();




const unlocked =

profile?.badges || [];





Badges.display(

"achievementContainer",

unlocked

);






let progress =

(unlocked.length / 10) * 100;



if(progress > 100)

progress = 100;






document.getElementById(

"achievementProgress"

)

.style.width =

progress + "%";





document.getElementById(

"progressText"

)

.innerHTML =

Math.floor(progress) +

"% Complete";






if(window.Orion){


Orion.say(

"Every badge represents your progress. Keep going!"

);


}



}





document.addEventListener(

"DOMContentLoaded",

()=>{


setTimeout(

loadAchievements,

1000

);


});



</script>





</body>

</html>
